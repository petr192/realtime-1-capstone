name: cap

x-logging: &logging
  driver: json-file
  options: {max-size: "5m", max-file: "2"}

services:
  postgres:
    image: postgres:16-alpine
    logging: *logging
    command: [postgres, -c, wal_level=logical, -c, max_replication_slots=10, -c, max_wal_senders=10]
    environment:
      POSTGRES_DB: capstone
      POSTGRES_USER: cocojumbo
      POSTGRES_PASSWORD: putmeup
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./shop_tables_ddl.sql:/docker-entrypoint-initdb.d/01-shop_tables_ddl.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cocojumbo -d capstone"]
      interval: 2s
      timeout: 3s
      retries: 40
      
  kafka:
    image: apache/kafka:4.2.1
    logging: *logging
    hostname: kafka
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qq
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 2
      KAFKA_LOG_CLEANUP_POLICY: delete
      KAFKA_LOG_RETENTION_HOURS: 336
    ports: ['127.0.0.1:9092:9092']
    volumes: ["kafkadata:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
      
  connect:
    image: quay.io/debezium/connect:3.3.1.Final
    logging: *logging
    ports: ["127.0.0.1:8083:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: capstone-connect
      CONFIG_STORAGE_TOPIC: capstone-config
      OFFSET_STORAGE_TOPIC: capstone-offset
      STATUS_STORAGE_TOPIC: capstone-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_FLUSH_INTERVAL_MS: 1000
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:8083/connectors >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 60
      
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    logging: *logging
    environment:
      CLICKHOUSE_USER: cocojumbo
      CLICKHOUSE_PASSWORD: putmeup
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    ports: ['127.0.0.1:18132:8123']
    volumes:
      - clickhousedata:/var/lib/clickhouse
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          clickhouse-client
          --user cocojumbo
          --password putmeup
          --query 'SELECT 1'
      interval: 3s
      timeout: 5s
      retries: 40

  kcat:
    image: edenhill/kcat:1.7.1
    profiles: [tools]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: capstone
      CLICKHOUSE_USER: cocojumbo
      CLICKHOUSE_PASSWORD: putmeup
    ports:
      - "127.0.0.1:18000:8000"

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=256MB
    ports:
      - "127.0.0.1:19004:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    logging: *logging

  grafana:
    image: grafana/grafana:12.1.1
    logging: *logging
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_USERS_DEFAULT_THEME: dark
    ports: ['127.0.0.1:13007:3000']
    volumes:
      - ./datasources.yml:/etc/grafana/provisioning/datasources/demo.yml:ro
      - ./dashboards.yml:/etc/grafana/provisioning/dashboards/demo.yml:ro
      - ./dashboard.json:/var/lib/grafana/dashboards/demo.json:ro
      - grafana-data:/var/lib/grafana
  

volumes:
  pgdata:
  kafkadata:
  clickhousedata:
  prometheus-data:
  grafana-data:
